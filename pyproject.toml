[project]
name = "better-xiaomi-cloud-map-extractor"
version = "0.0.0"
description = "Better Xiaomi Cloud Map Extractor - Home Assistant custom integration (development settings only)"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["scripts"]

[tool.ruff.lint]
# Correctness-focused baseline: pyflakes, syntax/runtime errors, bugbear, async pitfalls.
# Style rules are deliberately off so upstream imports stay small; widen this set in its own change.
select = ["F", "E9", "B", "ASYNC", "PLE"]
ignore = [
    "B904", # raise ... from err inside except: upstream style, tracked separately
]
